name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/andrei-isaev/whalewall

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Restrict publication refs
        shell: bash
        run: |
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            workflow_dispatch:refs/heads/master|push:refs/tags/v*) ;;
            *)
              echo "Event/ref ${GITHUB_EVENT_NAME}:${GITHUB_REF} is not allowed to publish images" >&2
              exit 1
              ;;
          esac

      - name: Require a successful Docker 29 test for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs="$(
            gh api --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
              -f head_sha="${GITHUB_SHA}" \
              -f status=success \
              -f per_page=100 \
              --jq '.total_count'
          )"
          if (( successful_runs < 1 )); then
            echo "No successful Test workflow exists for ${GITHUB_SHA}; refusing to publish" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify and report immutable image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid image digest: ${DIGEST}" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}"
          {
            echo "### Published image"
            echo
            echo "\`${IMAGE_NAME}@${DIGEST}\`"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
